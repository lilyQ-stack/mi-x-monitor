name: Test authorized Substack Notes importer (offline only)
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/substack-notes-authorized-20261116
    paths:
      - substack_notes_import.py
      - test_substack_notes_import.py
      - .github/workflows/test-substack-notes-offline.yml
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline-only tests (no platform requests)
        run: python -m unittest test_substack_notes_import.py -v
