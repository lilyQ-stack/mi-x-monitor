name: Collect MI activity
on:
  workflow_dispatch:
  schedule:
    - cron: '10 0,12 * * *'  # Beijing 08:10 and 20:10
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source collector
        run: python -m pip install --disable-pip-version-check 'twikit>=2,<3'
      - name: Collect / safe preflight
        env:
          X_COOKIES_BASE64: ${{ secrets.X_COOKIES_BASE64 }}
        run: python collector.py
      - name: Commit public metadata (never credentials)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest.json
          if [ -d data ]; then git add data; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update public activity monitor status"
            git push
          fi
