name: Backfill MI October 27
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - run: python backfill_oct27.py
      - name: Save backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/backfill-report.json data/nitter-2026-10-27.json
          if ! git diff --cached --quiet; then
            git commit -m "Save verified October 27 backfill"
            git push
          fi
