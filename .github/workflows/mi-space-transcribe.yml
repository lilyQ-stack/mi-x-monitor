name: MI Space audio collector (isolated)
on:
  push:
    paths:
      - 'mi_space_collect.py'
      - '.github/workflows/mi-space-transcribe.yml'
  workflow_dispatch:
    inputs:
      space_url:
        description: 'Optional specific public Space URL (https://x.com/i/spaces/ID)'
        required: false
        type: string
  schedule:
    # Beijing 05:35, 11:35, 17:35, 23:35. GitHub scheduled runs can be delayed.
    - cron: '35 21,3,9,15 * * *'
permissions:
  contents: write
concurrency:
  group: mi-space-transcribe
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Space downloader
        run: |
          python -m pip install --disable-pip-version-check --quiet -U yt-dlp
          ffmpeg -version | head -n 1
      - name: Find public Space links, download and transcribe
        env:
          SPACE_URL: ${{ inputs.space_url || '' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python mi_space_collect.py
      - name: Upload transcript as temporary Action artifact (not repository content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-space-transcript-${{ github.run_id }}
          path: out/space_transcripts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit public status only; no audio or complete transcripts
        if: always()
        run: |
          if [ ! -f state/mi-space-status.json ]; then
            echo 'No status file to commit'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/mi-space-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update MI Space download and ASR status'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'Space status committed'; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo '::warning::Could not push status after 5 retries'
          exit 1
