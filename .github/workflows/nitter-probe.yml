name: Test public Nitter feeds
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public feeds without logging in
        run: python nitter_probe.py
      - name: Commit diagnostic only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/nitter-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record no-login public Nitter diagnostics"
            git push
          fi
