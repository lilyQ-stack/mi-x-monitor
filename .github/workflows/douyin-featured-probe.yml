name: Douyin Featured public media probe (one-time, read-only)
on:
  push:
    paths:
      - '.github/workflows/douyin-featured-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public Featured video metadata and extractor
        run: |
          python -m pip install --quiet -U yt-dlp
          python - <<'PY'
          import json,re,urllib.request,urllib.error,subprocess,sys,html
          vids=['7705235743992949754','7705307245110671759','7605752227735680357']
          for vid in vids:
              url=f'https://jingxuan.douyin.com/m/video/{vid}'
              print(f'-----VIDEO {vid}-----',flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://jingxuan.douyin.com/'})
                  with urllib.request.urlopen(req,timeout=16) as r:
                      body=r.read(800000).decode('utf-8','replace')
                      print('PAGE_HTTP',r.status,'BYTES',len(body),'TITLE',re.findall(r'<title[^>]*>(.*?)</title>',body,re.S)[:1])
                      print('HAS_ELLIE', '艾丽的无废话财经' in body,'HAS_VIDEO_URL',bool(re.search(r'(play_addr|video_url|playApi|video/\\d+)',body)))
                      print('META',re.findall(r'<meta[^>]*>',body,re.I)[:4])
              except Exception as ex: print('PAGE_ERROR',type(ex).__name__,str(ex)[:220])
              for u in [url,f'https://www.douyin.com/video/{vid}']:
                  try:
                      p=subprocess.run([sys.executable,'-m','yt_dlp','--dump-single-json','--skip-download','--no-playlist','--no-warnings','--socket-timeout','15',u],capture_output=True,text=True,timeout=55)
                      if p.returncode==0:
                          try:
                              j=json.loads(p.stdout)
                              print('EXTRACT_OK',u,json.dumps({k:j.get(k) for k in ('id','title','uploader','duration','webpage_url','extractor','formats') if k!='formats'},ensure_ascii=False),'FORMATS',len(j.get('formats') or []))
                          except ValueError:print('EXTRACT_NONJSON',p.stdout[-300:])
                      else: print('EXTRACT_FAIL',u,'CODE',p.returncode,'DETAIL',p.stderr[-600:])
                  except Exception as ex: print('EXTRACT_ERROR',u,type(ex).__name__,str(ex)[:180])
          PY
