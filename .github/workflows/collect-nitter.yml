name: Collect public MI RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'  # Every 2 hours, including overnight (UTC)
permissions:
  contents: write
concurrency:
  group: nitter-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect from public RSS
        run: python collect_nitter.py
      - name: Validate collection health
        if: always()
        run: python check_health.py
      - name: Save public metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/nitter-latest.json state/health.json data/nitter-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Save public MI RSS snapshot"
            git push
          fi
