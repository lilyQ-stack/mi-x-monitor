name: Collect public MI RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0,8,16 * * *'  # UTC, Beijing 08:15, 16:15, 00:15
permissions:
  contents: write
concurrency:
  group: nitter-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect from public RSS
        run: python collect_nitter.py
      - name: Save public metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/nitter-latest.json data/nitter-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Save public MI RSS snapshot"
            git push
          fi
